<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Labirinto Isométrico Infinito 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }
    /* HUD / UI */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-card {
      background: rgba(14, 20, 31, 0.75);
      border: 1px solid rgba(0, 210, 255, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 15px rgba(0, 210, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 12px;
      color: #e5f2ff;
      max-width: 280px;
    }
    .hud-title {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #00d2ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-desc {
      font-size: 0.75rem;
      color: #9cb1c9;
      margin-top: 3px;
      line-height: 1.3;
    }
    .level-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.25), rgba(0, 114, 255, 0.1));
      border: 1px solid rgba(0, 210, 255, 0.4);
      color: #38e1ff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .level-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ffaa;
      box-shadow: 0 0 8px #00ffaa;
      animation: pulse 1.6s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    /* Touch Controls Zone & Joystick */
    #touch-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: auto;
    }
    #joystick-base {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.08) 0%, rgba(20, 26, 38, 0.6) 70%, rgba(0, 210, 255, 0.3) 100%);
      border: 2px solid rgba(0, 210, 255, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 0 16px rgba(0, 210, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.15s ease-out;
      pointer-events: none;
    }
    #joystick-knob {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #5ce4ff, #0088cc 80%);
      border: 2px solid #b8f2ff;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.6), 0 0 14px rgba(0, 210, 255, 0.6);
      transform: translate3d(0, 0, 0);
      pointer-events: none;
    }
    /* D-pad visual hints on the joystick base */
    .joy-arrow {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0.45;
      pointer-events: none;
    }
    .joy-arrow-up {
      top: 6px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 7px solid #00d2ff;
    }
    .joy-arrow-down {
      bottom: 6px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 7px solid #00d2ff;
    }
    .joy-arrow-left {
      left: 6px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 7px solid #00d2ff;
    }
    .joy-arrow-right {
      right: 6px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 7px solid #00d2ff;
    }
    /* Mobile Hint */
    #mobile-hint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.72rem;
      text-align: right;
      letter-spacing: 0.5px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- HUD -->
  <div id="hud">
    <div class="hud-card">
      <div class="hud-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
        <span>Isometric Maze</span>
      </div>
      <p class="hud-desc">WASD / Setas ou deslize no <b>Joystick na tela</b>. Caia no portal para o próximo andar!</p>
      <div class="level-badge">
        <span class="level-pulse"></span>
        Andar: <span id="level-counter">1</span>
      </div>
    </div>
  </div>

  <div id="mobile-hint">Toque e arraste para guiar</div>

  <!-- Joystick na Tela (Posicionamento Dinâmico / Flutuante e Fixo) -->
  <div id="touch-zone">
    <div id="joystick-base">
      <div class="joy-arrow joy-arrow-up"></div>
      <div class="joy-arrow joy-arrow-down"></div>
      <div class="joy-arrow joy-arrow-left"></div>
      <div class="joy-arrow joy-arrow-right"></div>
      <div id="joystick-knob"></div>
    </div>
  </div>

  <div id="game-canvas"></div>

  <script type="module">
    import * as THREE from 'three';

    // --- Parâmetros de Simulação e Grade ---
    const CELL_SIZE = 2.0;
    const WALL_HEIGHT = 1.4;
    const SPHERE_RADIUS = 0.45;
    const LEVEL_HEIGHT_OFFSET = 12.0;
    const MAZE_ROWS = 13; // Dimensão ímpar para o algoritmo DFS
    const MAZE_COLS = 13;

    let currentLevel = 1;
    let isFalling = false;
    let sphereVelocityY = 0;
    const GRAVITY = -38;
    const MOVE_SPEED = 7.5;

    // --- Paleta de Cores Procedural por Nível ---
    const THEMES = [
      { floor: 0x111622, wall: 0x223048, ring: 0x00ffff, sphere: 0x00d2ff },
      { floor: 0x1b1424, wall: 0x3d274c, ring: 0xff00cc, sphere: 0xff3b9d },
      { floor: 0x0f1c19, wall: 0x1f4438, ring: 0x00ff88, sphere: 0x26ffaa },
      { floor: 0x211710, wall: 0x47321e, ring: 0xffaa00, sphere: 0xffbb33 },
      { floor: 0x171221, wall: 0x37234d, ring: 0x8a2be2, sphere: 0xa855f7 }
    ];

    // --- Criação da Cena e Renderizador WebGL ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090c10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('game-canvas').appendChild(renderer.domElement);

    // --- Câmera Isométrica Fiel (OrthographicCamera) ---
    const aspect = window.innerWidth / window.innerHeight;
    const viewSize = 22;
    const camera = new THREE.OrthographicCamera(
      (-viewSize * aspect) / 2,
      (viewSize * aspect) / 2,
      viewSize / 2,
      -viewSize / 2,
      1,
      1000
    );

    // Offset isométrico verdadeiro: 45° no plano XZ com inclinação vertical elevada
    const isoDistance = 45;
    const isoOffset = new THREE.Vector3(isoDistance, isoDistance * 1.25, isoDistance);

    // --- Iluminação de Alta Definição ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
    sunLight.position.set(40, 75, 30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.left = -30;
    sunLight.shadow.camera.right = 30;
    sunLight.shadow.camera.top = 30;
    sunLight.shadow.camera.bottom = -30;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    // Luz de preenchimento suave
    const fillLight = new THREE.DirectionalLight(0x4070a0, 0.45);
    fillLight.position.set(-30, 20, -20);
    scene.add(fillLight);

    // --- Algoritmo de Labirinto Procedural (DFS Recursivo com Pilha) ---
    function generateMaze(rows, cols, startR, startC) {
      const grid = Array.from({ length: rows }, () => Array(cols).fill(1));

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function carve(r, c) {
        grid[r][c] = 0;
        const dirs = shuffle([
          [0, -2],
          [0, 2],
          [-2, 0],
          [2, 0]
        ]);

        for (const [dr, dc] of dirs) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr > 0 && nr < rows - 1 && nc > 0 && nc < cols - 1 && grid[nr][nc] === 1) {
            grid[r + dr / 2][c + dc / 2] = 0;
            carve(nr, nc);
          }
        }
      }

      carve(startR, startC);
      return grid;
    }

    // --- Construtor de Níveis ---
    let activeLevelData = null;
    let oldLevelData = null;

    const wallGeometry = new THREE.BoxGeometry(CELL_SIZE, WALL_HEIGHT, CELL_SIZE);
    const floorGeometry = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);

    function createLevel(levelIndex, startWorldPos) {
      const group = new THREE.Group();
      const baseY = -(levelIndex - 1) * LEVEL_HEIGHT_OFFSET;
      const theme = THEMES[(levelIndex - 1) % THEMES.length];

      const startR = 1;
      const startC = 1;
      const exitR = MAZE_ROWS - 2;
      const exitC = MAZE_COLS - 2;

      const grid = generateMaze(MAZE_ROWS, MAZE_COLS, startR, startC);
      grid[exitR][exitC] = 0;

      // Alinhamento exato: a célula inicial fica precisamente na posição horizontal onde a bola está caindo
      const originX = startWorldPos.x - startC * CELL_SIZE;
      const originZ = startWorldPos.z - startR * CELL_SIZE;

      const colliders = [];

      const wallMat = new THREE.MeshStandardMaterial({
        color: theme.wall,
        roughness: 0.35,
        metalness: 0.15,
        transparent: true,
        opacity: 1.0
      });

      const floorMat = new THREE.MeshStandardMaterial({
        color: theme.floor,
        roughness: 0.8
      });

      for (let r = 0; r < MAZE_ROWS; r++) {
        for (let c = 0; c < MAZE_COLS; c++) {
          const posX = originX + c * CELL_SIZE;
          const posZ = originZ + r * CELL_SIZE;

          if (grid[r][c] === 1) {
            const wall = new THREE.Mesh(wallGeometry, wallMat);
            wall.position.set(posX, baseY + WALL_HEIGHT / 2, posZ);
            wall.castShadow = true;
            wall.receiveShadow = true;
            group.add(wall);

            colliders.push({
              minX: posX - CELL_SIZE / 2,
              maxX: posX + CELL_SIZE / 2,
              minZ: posZ - CELL_SIZE / 2,
              maxZ: posZ + CELL_SIZE / 2
            });
          } else {
            const isExit = (r === exitR && c === exitC);
            if (!isExit) {
              const floorTile = new THREE.Mesh(floorGeometry, floorMat);
              floorTile.rotation.x = -Math.PI / 2;
              floorTile.position.set(posX, baseY, posZ);
              floorTile.receiveShadow = true;
              group.add(floorTile);
            }
          }
        }
      }

      // Portal do buraco de saída (anel brilhante neon com efeito de pulsação)
      const exitWorldX = originX + exitC * CELL_SIZE;
      const exitWorldZ = originZ + exitR * CELL_SIZE;

      const ringGeo = new THREE.RingGeometry(CELL_SIZE * 0.3, CELL_SIZE * 0.44, 32);
      const ringMat = new THREE.MeshBasicMaterial({
        color: theme.ring,
        side: THREE.DoubleSide
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = -Math.PI / 2;
      ringMesh.position.set(exitWorldX, baseY + 0.02, exitWorldZ);
      group.add(ringMesh);

      scene.add(group);

      return {
        group,
        baseY,
        colliders,
        wallMat,
        theme,
        ringMesh,
        exitPos: new THREE.Vector3(exitWorldX, baseY, exitWorldZ),
        startPos: new THREE.Vector3(startWorldPos.x, baseY + SPHERE_RADIUS, startWorldPos.z)
      };
    }

    // --- Esfera do Jogador ---
    const sphereGeo = new THREE.SphereGeometry(SPHERE_RADIUS, 32, 32);
    const sphereMat = new THREE.MeshStandardMaterial({
      color: 0x00d2ff,
      roughness: 0.15,
      metalness: 0.45,
      emissive: 0x004d73,
      emissiveIntensity: 0.45
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    sphere.castShadow = true;
    sphere.receiveShadow = true;
    scene.add(sphere);

    // Inicialização do Nível 1
    const initialPos = new THREE.Vector3(CELL_SIZE, SPHERE_RADIUS, CELL_SIZE);
    activeLevelData = createLevel(1, initialPos);
    sphere.position.copy(activeLevelData.startPos);

    // --- Entradas do Teclado ---
    const keys = {};
    window.addEventListener('keydown', (e) => (keys[e.key.toLowerCase()] = true));
    window.addEventListener('keyup', (e) => (keys[e.key.toLowerCase()] = false));

    // --- Sistema de Joystick Virtual Mobile (Pointer Events / Multi-Touch) ---
    const touchZone = document.getElementById('touch-zone');
    const joyBase = document.getElementById('joystick-base');
    const joyKnob = document.getElementById('joystick-knob');

    let isPointerDown = false;
    let activePointerId = null;
    let joyStartPos = { x: 0, y: 0 };
    let joyDelta = { x: 0, y: 0 };
    const JOYSTICK_MAX_RADIUS = 46;

    // Posição base padrão (canto inferior esquerdo)
    const baseDefault = {
      left: 30,
      bottom: 30,
      width: 124,
      height: 124
    };

    function resetJoystick() {
      isPointerDown = false;
      activePointerId = null;
      joyDelta = { x: 0, y: 0 };
      joyKnob.style.transform = 'translate3d(0px, 0px, 0)';
      joyBase.style.transition = 'opacity 0.25s, transform 0.2s';
      joyBase.style.opacity = '0.85';
      joyBase.style.left = `${baseDefault.left}px`;
      joyBase.style.bottom = `${baseDefault.bottom}px`;
      joyBase.style.top = 'auto';
    }

    touchZone.addEventListener('pointerdown', (e) => {
      // Prioriza toque na metade esquerda ou inferior para spawn do joystick
      if (isPointerDown) return;
      isPointerDown = true;
      activePointerId = e.pointerId;
      touchZone.setPointerCapture(e.pointerId);

      const rect = touchZone.getBoundingClientRect();
      const pointerX = e.clientX - rect.left;
      const pointerY = e.clientY - rect.top;

      joyStartPos = { x: pointerX, y: pointerY };

      // Move o centro da base do joystick para o ponto tocado suavemente
      joyBase.style.transition = 'none';
      joyBase.style.left = `${pointerX - baseDefault.width / 2}px`;
      joyBase.style.top = `${pointerY - baseDefault.height / 2}px`;
      joyBase.style.bottom = 'auto';
      joyBase.style.opacity = '1.0';

      joyDelta = { x: 0, y: 0 };
      joyKnob.style.transform = 'translate3d(0px, 0px, 0)';
    });

    touchZone.addEventListener('pointermove', (e) => {
      if (!isPointerDown || e.pointerId !== activePointerId) return;

      const rect = touchZone.getBoundingClientRect();
      const currentX = e.clientX - rect.left;
      const currentY = e.clientY - rect.top;

      let dx = currentX - joyStartPos.x;
      let dy = currentY - joyStartPos.y;
      const dist = Math.hypot(dx, dy);

      if (dist > JOYSTICK_MAX_RADIUS) {
        dx = (dx / dist) * JOYSTICK_MAX_RADIUS;
        dy = (dy / dist) * JOYSTICK_MAX_RADIUS;
      }

      joyKnob.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;

      // Vetor normalizado (-1 a 1) na tela
      joyDelta.x = dx / JOYSTICK_MAX_RADIUS;
      joyDelta.y = dy / JOYSTICK_MAX_RADIUS;
    });

    const endPointerHandler = (e) => {
      if (e.pointerId === activePointerId) {
        resetJoystick();
      }
    };

    touchZone.addEventListener('pointerup', endPointerHandler);
    touchZone.addEventListener('pointercancel', endPointerHandler);

    // --- Colisão Esfera vs Caixas (AABB) ---
    function resolveCollisions(nextX, nextZ, colliders) {
      let finalX = nextX;
      let finalZ = nextZ;

      for (const box of colliders) {
        const closestX = Math.max(box.minX, Math.min(finalX, box.maxX));
        const closestZ = Math.max(box.minZ, Math.min(finalZ, box.maxZ));

        const distX = finalX - closestX;
        const distZ = finalZ - closestZ;
        const distSq = distX * distX + distZ * distZ;

        if (distSq < SPHERE_RADIUS * SPHERE_RADIUS) {
          const dist = Math.sqrt(distSq);
          if (dist > 0.0001) {
            const overlap = SPHERE_RADIUS - dist;
            finalX += (distX / dist) * overlap;
            finalZ += (distZ / dist) * overlap;
          }
        }
      }
      return { x: finalX, z: finalZ };
    }

    // --- Transição de Nível (Queda Vertical em Linha Reta) ---
    function triggerFall() {
      isFalling = true;
      sphereVelocityY = 0;
      currentLevel++;
      document.getElementById('level-counter').innerText = currentLevel;

      // Trava os eixos X e Z exatamente sobre o centro do buraco luminoso
      sphere.position.x = activeLevelData.exitPos.x;
      sphere.position.z = activeLevelData.exitPos.z;

      oldLevelData = activeLevelData;
      // Cria o novo andar com o início perfeitamente sob o buraco de queda
      activeLevelData = createLevel(currentLevel, activeLevelData.exitPos);

      // Transição dinâmica de cor na esfera para combinar com a nova fase
      sphereMat.color.set(activeLevelData.theme.sphere);
    }

    // --- Loop de Jogo e Renderização ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);

      if (!isFalling) {
        // Vetor de entrada na tela (Screen Space: X = Direita, Y = Cima)
        let inputScreenX = 0;
        let inputScreenY = 0;

        // 1. Leitura do Teclado
        if (keys['w'] || keys['arrowup'])    inputScreenY += 1;
        if (keys['s'] || keys['arrowdown'])  inputScreenY -= 1;
        if (keys['a'] || keys['arrowleft'])  inputScreenX -= 1;
        if (keys['d'] || keys['arrowright']) inputScreenX += 1;

        // 2. Leitura do Joystick Virtual Mobile
        if (isPointerDown) {
          inputScreenX += joyDelta.x;
          inputScreenY -= joyDelta.y; // Inverte o eixo Y da tela (topo é negativo no DOM)
        }

        const inputLen = Math.hypot(inputScreenX, inputScreenY);

        if (inputLen > 0.05) {
          const normScreenX = inputScreenX / Math.max(1, inputLen);
          const normScreenY = inputScreenY / Math.max(1, inputLen);
          const moveMagnitude = Math.min(1.0, inputLen);

          /*
            Transformação Isométrica:
            Na projeção isométrica padrão (câmera em +X, +Z olhando para origem):
            - Mover para CIMA na tela (Screen Y > 0) corresponde ao vetor 3D (-1, 0, -1)
            - Mover para a DIREITA na tela (Screen X > 0) corresponde ao vetor 3D (+1, 0, -1)
          */
          const worldDirX = (normScreenX - normScreenY) * 0.707106;
          const worldDirZ = (-normScreenX - normScreenY) * 0.707106;

          const moveDist = MOVE_SPEED * moveMagnitude * delta;
          const candidateX = sphere.position.x + worldDirX * moveDist;
          const candidateZ = sphere.position.z + worldDirZ * moveDist;

          const resolved = resolveCollisions(candidateX, candidateZ, activeLevelData.colliders);
          const actualMoveX = resolved.x - sphere.position.x;
          const actualMoveZ = resolved.z - sphere.position.z;

          sphere.position.x = resolved.x;
          sphere.position.z = resolved.z;

          // Rotação física realista da esfera na superfície
          const actualDist = Math.hypot(actualMoveX, actualMoveZ);
          if (actualDist > 0.0001) {
            const rollAngle = actualDist / SPHERE_RADIUS;
            const rollAxis = new THREE.Vector3(-actualMoveZ, 0, actualMoveX).normalize();
            sphere.rotateOnWorldAxis(rollAxis, rollAngle);
          }
        }

        // Verificação do gatilho do portal
        const distToExit = Math.hypot(
          sphere.position.x - activeLevelData.exitPos.x,
          sphere.position.z - activeLevelData.exitPos.z
        );

        if (distToExit < CELL_SIZE * 0.38) {
          triggerFall();
        }

        // Efeito de pulso de escala no anel de saída
        if (activeLevelData && activeLevelData.ringMesh) {
          const s = 1.0 + Math.sin(clock.getElapsedTime() * 5.0) * 0.08;
          activeLevelData.ringMesh.scale.set(s, s, s);
        }

      } else {
        // --- Estado de Queda Livre com Gravidade ---
        sphereVelocityY += GRAVITY * delta;
        sphere.position.y += sphereVelocityY * delta;

        // Desvanecimento suave das paredes do andar antigo
        if (oldLevelData) {
          oldLevelData.wallMat.opacity = Math.max(0, oldLevelData.wallMat.opacity - delta * 3.0);
        }

        const floorTargetY = activeLevelData.baseY + SPHERE_RADIUS;

        // Pouso no novo andar
        if (sphere.position.y <= floorTargetY) {
          sphere.position.y = floorTargetY;
          sphereVelocityY = 0;
          isFalling = false;

          // Limpeza completa de recursos do nível anterior
          if (oldLevelData) {
            scene.remove(oldLevelData.group);
            oldLevelData.group.traverse((node) => {
              if (node.geometry) node.geometry.dispose();
              if (node.material) {
                if (Array.isArray(node.material)) node.material.forEach((m) => m.dispose());
                else node.material.dispose();
              }
            });
            oldLevelData = null;
          }
        }
      }

      // Interpolação suave (LERP) da câmera isométrica acompanhando a esfera em 3D
      const targetCamPos = sphere.position.clone().add(isoOffset);
      camera.position.lerp(targetCamPos, 0.09);
      camera.lookAt(sphere.position);

      renderer.render(scene, camera);
    }

    // --- Ajuste Responsivo da Câmera e Canvas ---
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const currentAspect = w / h;

      camera.left = (-viewSize * currentAspect) / 2;
      camera.right = (viewSize * currentAspect) / 2;
      camera.top = viewSize / 2;
      camera.bottom = -viewSize / 2;
      camera.updateProjectionMatrix();

      renderer.setSize(w, h);
    });

    // Posição inicial da câmera sem snap
    camera.position.copy(sphere.position).add(isoOffset);
    camera.lookAt(sphere.position);

    // Iniciar loop de animação
    animate();
  </script>
</body>
</html>
